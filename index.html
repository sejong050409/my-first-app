<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 28px;
      height: fit-content;
    }

    h1 { font-size: 24px; margin-bottom: 20px; }

    form { display: flex; gap: 8px; margin-bottom: 20px; }

    #todo-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }
    #todo-input:focus { border-color: #3b82f6; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-btn {
      padding: 10px 16px;
      background: #3b82f6;
      color: #fff;
    }
    .add-btn:hover { background: #2563eb; }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid #e5e7eb;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    li span {
      flex: 1;
      word-break: break-word;
    }

    li.done span {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      background: transparent;
      color: #ef4444;
      padding: 4px 8px;
      font-size: 14px;
    }
    .delete-btn:hover { background: #fee2e2; }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 24px 0;
    }

    .footer {
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>할 일 목록</h1>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="todo-list"></ul>
    <p class="footer" id="counter"></p>
  </div>

  <script>
    const STORAGE_KEY = "todos";

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const counter = document.getElementById("counter");

    // localStorage에서 목록 불러오기
    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    // localStorage에 목록 저장하기
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    let todos = loadTodos();

    // 화면 그리기
    function render() {
      list.innerHTML = "";

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">할 일이 없습니다</li>';
      }

      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.textContent = todo.text; // textContent로 넣어서 HTML 삽입 방지

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "삭제";
        delBtn.addEventListener("click", () => deleteTodo(todo.id));

        li.append(checkbox, text, delBtn);
        list.appendChild(li);
      });

      const remaining = todos.filter((t) => !t.done).length;
      counter.textContent = `전체 ${todos.length}개 · 남은 일 ${remaining}개`;
    }

    // 추가
    function addTodo(text) {
      todos.push({ id: Date.now(), text, done: false });
      saveTodos();
      render();
    }

    // 완료 체크 토글
    function toggleTodo(id) {
      todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      saveTodos();
      render();
    }

    // 삭제
    function deleteTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      saveTodos();
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTodo(text);
      input.value = "";
      input.focus();
    });

    render();
  </script>
</body>
</html>
