<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 달력</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      height: fit-content;
    }

    button { cursor: pointer; border: none; border-radius: 8px; font-size: 15px; font-family: inherit; }

    /* ---------- 달력 헤더 ---------- */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
    }
    .cal-header h1 { font-size: 22px; }
    .nav { display: flex; gap: 6px; }
    .nav button {
      background: #f3f4f6;
      padding: 8px 12px;
      color: #374151;
    }
    .nav button:hover { background: #e5e7eb; }

    /* ---------- 달력 본체 ---------- */
    .weekdays, .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .weekdays div {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      padding: 6px 0;
    }
    .weekdays div:first-child { color: #ef4444; }
    .weekdays div:last-child { color: #3b82f6; }

    .grid {
      border-top: 1px solid #e5e7eb;
      border-left: 1px solid #e5e7eb;
    }
    .day {
      min-height: 92px;
      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
      min-width: 0;
      background: #fff;
      text-align: left;
      border-radius: 0;
      font-size: inherit;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .day:hover { background: #f9fafb; }
    .day.other { background: #fafafa; }
    .day.other .num { color: #d1d5db; }
    .day.selected { background: #eff6ff; box-shadow: inset 0 0 0 2px #3b82f6; }

    .num {
      font-size: 13px;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .day.sun .num { color: #ef4444; }
    .day.sat .num { color: #3b82f6; }
    .day.today .num { background: #3b82f6; color: #fff; }

    .chip {
      font-size: 12px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 4px;
      padding: 1px 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip.done { background: #f3f4f6; color: #9ca3af; text-decoration: line-through; }
    .more { font-size: 11px; color: #6b7280; padding-left: 4px; }

    /* ---------- 선택한 날짜 패널 ---------- */
    .panel { margin-top: 24px; }
    .panel h2 { font-size: 18px; margin-bottom: 12px; }

    form { display: flex; gap: 8px; margin-bottom: 12px; }
    #todo-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }
    #todo-input:focus { border-color: #3b82f6; }
    .add-btn { padding: 10px 16px; background: #3b82f6; color: #fff; }
    .add-btn:hover { background: #2563eb; }

    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid #e5e7eb;
    }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    .delete-btn { background: transparent; color: #ef4444; padding: 4px 8px; font-size: 14px; }
    .delete-btn:hover { background: #fee2e2; }
    .empty { justify-content: center; color: #9ca3af; padding: 20px 0; border-bottom: none; }

    .row-btn { background: transparent; color: #6b7280; padding: 4px 8px; font-size: 14px; }
    .row-btn:hover { background: #f3f4f6; }

    /* 수정 중인 줄 */
    li.editing { flex-wrap: wrap; }
    .edit-text, .edit-date {
      padding: 8px 10px;
      font-size: 15px;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
    }
    .edit-text { flex: 1 1 200px; min-width: 0; }
    .edit-date { flex: 0 0 auto; }
    .save-btn { background: #3b82f6; color: #fff; padding: 8px 12px; font-size: 14px; }
    .save-btn:hover { background: #2563eb; }

    .footer { margin-top: 12px; font-size: 14px; color: #6b7280; }

    /* 백업 */
    .backup {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #6b7280;
    }
    .backup .label { margin-right: auto; }
    .backup button { background: #f3f4f6; color: #374151; padding: 8px 12px; font-size: 14px; }
    .backup button:hover { background: #e5e7eb; }

    /* ---------- 좁은 화면: 칸 안에는 점만 표시 ---------- */
    @media (max-width: 560px) {
      .container { padding: 16px; }
      .day { min-height: 56px; align-items: center; }
      .chip, .more { display: none; }
      .dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; }
      .dot.done { background: #d1d5db; }
    }
    @media (min-width: 561px) {
      .dots { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cal-header">
      <h1 id="month-title"></h1>
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <button id="today-btn">오늘</button>
        <button id="next" aria-label="다음 달">›</button>
      </div>
    </div>

    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="grid" id="grid"></div>

    <section class="panel">
      <h2 id="selected-title"></h2>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="이 날짜에 할 일을 입력하세요" autocomplete="off">
        <button type="submit" class="add-btn">추가</button>
      </form>
      <ul id="todo-list"></ul>
      <p class="footer" id="counter"></p>
    </section>

    <section class="backup">
      <span class="label">백업: 목록을 파일로 저장해 두면 브라우저 데이터가 지워져도 되살릴 수 있어요</span>
      <button type="button" id="export-btn">내보내기</button>
      <button type="button" id="import-btn">가져오기</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    const MAX_CHIPS = 3; // 달력 칸 하나에 보여줄 최대 개수

    const grid = document.getElementById("grid");
    const monthTitle = document.getElementById("month-title");
    const selectedTitle = document.getElementById("selected-title");
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const counter = document.getElementById("counter");

    // 날짜를 "YYYY-MM-DD" 문자열로 (현지 시간 기준)
    function toKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function fromKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    const todayKey = toKey(new Date());

    // localStorage에서 불러오기 (날짜 없는 예전 할 일은 오늘 날짜로 옮김)
    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        return saved.map((t) => (t.date ? t : { ...t, date: todayKey }));
      } catch {
        return [];
      }
    }
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    let todos = loadTodos();
    saveTodos(); // 옮긴 날짜를 바로 저장

    let selectedKey = todayKey;
    let editingId = null; // 지금 수정 중인 할 일의 id
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth(); // 0~11

    function todosOn(key) {
      return todos.filter((t) => t.date === key);
    }

    // ---------- 달력 그리기 ----------
    function renderCalendar() {
      monthTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
      grid.innerHTML = "";

      // 달력 첫 칸 = 이번 달 1일이 속한 주의 일요일
      const first = new Date(viewYear, viewMonth, 1);
      const start = new Date(viewYear, viewMonth, 1 - first.getDay());
      // 이번 달을 다 담는 주 수만큼 (4~6주)
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const weeks = Math.ceil((first.getDay() + daysInMonth) / 7);

      for (let i = 0; i < weeks * 7; i++) {
        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const key = toKey(date);
        const items = todosOn(key);

        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day";
        if (date.getMonth() !== viewMonth) cell.classList.add("other");
        if (date.getDay() === 0) cell.classList.add("sun");
        if (date.getDay() === 6) cell.classList.add("sat");
        if (key === todayKey) cell.classList.add("today");
        if (key === selectedKey) cell.classList.add("selected");
        cell.setAttribute("aria-label", `${date.getMonth() + 1}월 ${date.getDate()}일, 할 일 ${items.length}개`);

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = date.getDate();
        cell.appendChild(num);

        // 넓은 화면: 할 일 제목 표시
        items.slice(0, MAX_CHIPS).forEach((t) => {
          const chip = document.createElement("div");
          chip.className = "chip" + (t.done ? " done" : "");
          chip.textContent = t.text;
          cell.appendChild(chip);
        });
        if (items.length > MAX_CHIPS) {
          const more = document.createElement("div");
          more.className = "more";
          more.textContent = `+${items.length - MAX_CHIPS}개 더`;
          cell.appendChild(more);
        }

        // 좁은 화면: 점으로 표시
        if (items.length) {
          const dots = document.createElement("div");
          dots.className = "dots";
          items.slice(0, 6).forEach((t) => {
            const dot = document.createElement("span");
            dot.className = "dot" + (t.done ? " done" : "");
            dots.appendChild(dot);
          });
          cell.appendChild(dots);
        }

        cell.addEventListener("click", () => selectDate(key));
        grid.appendChild(cell);
      }
    }

    // ---------- 선택한 날짜의 목록 그리기 ----------
    function renderList() {
      const d = fromKey(selectedKey);
      const weekday = "일월화수목금토"[d.getDay()];
      selectedTitle.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${weekday})${selectedKey === todayKey ? " · 오늘" : ""}`;

      const items = todosOn(selectedKey);
      list.innerHTML = "";

      if (items.length === 0) {
        list.innerHTML = '<li class="empty">이 날짜에는 할 일이 없습니다</li>';
      }

      items.forEach((todo) => {
        list.appendChild(todo.id === editingId ? editRow(todo) : viewRow(todo));
      });

      const remaining = items.filter((t) => !t.done).length;
      counter.textContent = `이 날짜 ${items.length}개 · 남은 일 ${remaining}개`;
    }

    // 보통 줄: 체크박스 · 글자 · 수정 · 삭제
    function viewRow(todo) {
      const li = document.createElement("li");
      if (todo.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      const text = document.createElement("span");
      text.textContent = todo.text; // HTML 삽입 방지
      text.title = "더블클릭해서 수정";
      text.addEventListener("dblclick", () => startEdit(todo.id));

      const editBtn = document.createElement("button");
      editBtn.className = "row-btn";
      editBtn.textContent = "수정";
      editBtn.addEventListener("click", () => startEdit(todo.id));

      const delBtn = document.createElement("button");
      delBtn.className = "delete-btn";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => deleteTodo(todo.id));

      li.append(checkbox, text, editBtn, delBtn);
      return li;
    }

    // 수정 중인 줄: 글자 입력 · 날짜 선택 · 저장 · 취소
    function editRow(todo) {
      const li = document.createElement("li");
      li.classList.add("editing");

      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.className = "edit-text";
      textInput.value = todo.text;
      textInput.setAttribute("aria-label", "할 일 내용");

      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.className = "edit-date";
      dateInput.value = todo.date;
      dateInput.setAttribute("aria-label", "날짜");

      const save = () => saveEdit(todo.id, textInput.value, dateInput.value);

      const saveBtn = document.createElement("button");
      saveBtn.className = "save-btn";
      saveBtn.textContent = "저장";
      saveBtn.addEventListener("click", save);

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "row-btn";
      cancelBtn.textContent = "취소";
      cancelBtn.addEventListener("click", cancelEdit);

      // Enter = 저장, Esc = 취소
      [textInput, dateInput].forEach((el) =>
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); save(); }
          if (e.key === "Escape") cancelEdit();
        })
      );

      li.append(textInput, dateInput, saveBtn, cancelBtn);
      requestAnimationFrame(() => { textInput.focus(); textInput.select(); });
      return li;
    }

    function render() {
      renderCalendar();
      renderList();
    }

    // ---------- 동작 ----------
    function selectDate(key) {
      selectedKey = key;
      editingId = null;
      const d = fromKey(key);
      viewYear = d.getFullYear();   // 다른 달 날짜를 누르면 그 달로 이동
      viewMonth = d.getMonth();
      render();
      input.focus();
    }

    function addTodo(text) {
      todos.push({ id: Date.now(), text, done: false, date: selectedKey });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      if (editingId === id) editingId = null;
      saveTodos();
      render();
    }

    // ---------- 수정 ----------
    function startEdit(id) {
      editingId = id;
      renderList();
    }

    function cancelEdit() {
      editingId = null;
      renderList();
    }

    function saveEdit(id, newText, newDate) {
      const text = newText.trim();
      if (!text) return; // 빈 내용은 저장하지 않음 (지우려면 삭제 버튼)
      const date = DATE_RE.test(newDate) ? newDate : null;
      todos = todos.map((t) => (t.id === id ? { ...t, text, date: date || t.date } : t));
      editingId = null;
      saveTodos();
      render();
    }

    // ---------- 백업: 내보내기 / 가져오기 ----------
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

    function exportTodos() {
      const data = { app: "todo-calendar", version: 1, exportedAt: new Date().toISOString(), todos };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `할일-백업-${todayKey}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // 파일 안의 항목을 검사해서 올바른 것만 골라냄
    function cleanImported(raw) {
      const arr = Array.isArray(raw) ? raw : raw && Array.isArray(raw.todos) ? raw.todos : null;
      if (!arr) return null;
      return arr
        .filter((t) => t && typeof t.text === "string" && t.text.trim())
        .map((t, i) => ({
          id: typeof t.id === "number" ? t.id : Date.now() + i,
          text: t.text.trim(),
          done: t.done === true,
          date: typeof t.date === "string" && DATE_RE.test(t.date) ? t.date : todayKey,
        }));
    }

    function importTodos(file) {
      const reader = new FileReader();
      reader.onload = () => {
        let incoming;
        try {
          incoming = cleanImported(JSON.parse(reader.result));
        } catch {
          incoming = null;
        }
        if (!incoming) {
          alert("백업 파일을 읽을 수 없어요. 이 사이트에서 내보낸 .json 파일인지 확인해 주세요.");
          return;
        }

        // 지금 목록은 지우지 않고, 없는 항목만 더함 (같은 id는 건너뜀)
        const existing = new Set(todos.map((t) => t.id));
        const added = incoming.filter((t) => !existing.has(t.id));
        todos = todos.concat(added);
        saveTodos();
        render();
        alert(`할 일 ${added.length}개를 가져왔어요.` +
          (incoming.length > added.length ? ` (이미 있는 ${incoming.length - added.length}개는 건너뜀)` : ""));
      };
      reader.readAsText(file);
    }

    const importFile = document.getElementById("import-file");
    document.getElementById("export-btn").addEventListener("click", exportTodos);
    document.getElementById("import-btn").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", () => {
      if (importFile.files[0]) importTodos(importFile.files[0]);
      importFile.value = ""; // 같은 파일을 다시 골라도 동작하게
    });

    function moveMonth(delta) {
      const d = new Date(viewYear, viewMonth + delta, 1);
      viewYear = d.getFullYear();
      viewMonth = d.getMonth();
      renderCalendar();
    }

    document.getElementById("prev").addEventListener("click", () => moveMonth(-1));
    document.getElementById("next").addEventListener("click", () => moveMonth(1));
    document.getElementById("today-btn").addEventListener("click", () => selectDate(todayKey));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTodo(text);
      input.value = "";
      input.focus();
    });

    render();
  </script>
</body>
</html>
